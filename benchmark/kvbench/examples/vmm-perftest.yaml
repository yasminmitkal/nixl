# vmm-perftest: every value below is the default, except path.
# path selects the CUDA handle type: nvlink exports fabric handles, rdma exports
# POSIX file descriptors. The transports come from UCX_TLS, set by the launcher.
path: nvlink
patterns: [grow, shrink, ends, remap]
register: [full, partial]
metadata: [partial, agent]
ops: [WRITE, READ]
chunk_units: [1, 4, 16]
chunks: 8
payload: 4096
iters: 5
warmup_iters: 1
xfer_iters: 10
transfer_timeout_sec: 15
exchange_timeout_sec: 300
